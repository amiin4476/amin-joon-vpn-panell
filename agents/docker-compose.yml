services:
  node-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: amin-joon-node-agent

    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN must be set}
      NODE_NAME: ${NODE_NAME:-unknown-node}

    ports:
      - "127.0.0.1:9000:9000"

    restart: unless-stopped

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp
